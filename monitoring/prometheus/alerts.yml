# Alert rules for the labs (evaluated by Prometheus; state visible at :9090/alerts and on the Grafana overview).
groups:
  - name: lab-exporters
    rules:
      - alert: ExporterDown    # only for VMs the portal reports as running: a powered-off lab is a normal state
        expr: (up{job=~"node|frr"} == 0) and on (lab, node) (lab_vm_running == 1)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.job }} exporter on {{ $labels.node }} ({{ $labels.instance }}) not scraped for 2 minutes"}
      - alert: PortalDown
        expr: up{job="portal"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "the {{ $labels.lab }} portal ({{ $labels.instance }}) is not answering"}
      - alert: PortalCollectorStale    # only while the lab runs
        expr: (time() - lab_collector_last_refresh_seconds > 600) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "the {{ $labels.lab }} portal has not refreshed its live state for 10 minutes"}

  - name: srv6-core
    rules:
      - alert: TenantHostUnreachable
        expr: (lab_host_reachable == 0) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.host }} ({{ $labels.tenant }}, {{ $labels.dc }}) does not answer SSH"}
      - alert: TenantSiteBgpDown
        expr: (lab_tenant_site_bgp_up == 0) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.tenant }} {{ $labels.dc }}: eBGP {{ $labels.pe }} - {{ $labels.ce }} is not Established"}
      - alert: TenantDegraded
        expr: (lab_tenant_health < 2) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.tenant }} is {{ if eq $value 1.0 }}degraded{{ else }}down{{ end }}"}
      - alert: InternetBreakoutDown
        expr: ((lab_internet_bgp_up == 0) or (lab_internet_default_route == 0) or (lab_internet_fw_reachable == 0)) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "internet breakout: {{ if $labels.pe }}{{ $labels.tenant }} on {{ $labels.pe }}{{ else }}{{ $labels.fw }}{{ end }} — session down, no default route, or the firewall unreachable"}
      - alert: IsisAdjacencyMissing
        expr: (lab_isis_adjacencies_up < lab_isis_adjacencies_expected) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} IS-IS adjacencies up, fewer than its core links"}
      - alert: BfdSessionDown
        expr: (lab_bfd_sessions_up < lab_isis_adjacencies_expected) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: a BFD session is down ({{ $value }} up)"}
      - alert: VpnV4SessionDown
        expr: (lab_vpnv4_session_up == 0) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.pe }}: VPNv4 session to route reflector {{ $labels.reflector }} down"}
      - alert: FrrBgpPeerDown
        expr: (frr_bgp_peer_state{job="frr"} != 1) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: BGP peer {{ $labels.peer }} ({{ $labels.vrf }} {{ $labels.safi }}) not Established"}
      - alert: LabTestsFailed
        expr: lab_tests_last_failed > 0
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.lab }}: {{ $value }} Robot test(s) failed in the last run"}

  - name: nodes
    rules:
      - alert: NodeHighCpu
        expr: 100 * (1 - avg by (node, role, lab) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: CPU {{ $value | printf \"%.0f\" }} % for 10 minutes"}
      - alert: NodeLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: less than 10 % memory available"}
      - alert: NodeDiskFull    # the persistent disk: "/" on the hosts, the persistence mount on VyOS (live-boot overlay)
        expr: node_filesystem_avail_bytes{mountpoint=~"/|/usr/lib/live/mount/persistence",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint=~"/|/usr/lib/live/mount/persistence",fstype!="tmpfs"} < 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: {{ $labels.mountpoint }} under 10 % free"}

  - name: cat8000v-ipsec
    rules:
      - alert: TunnelDown
        expr: (lab_tunnel_health{lab="cat8000v-ipsec"} < 2) and on (lab) (sum by (lab) (lab_vm_running{role="hub"}) > 0)
        for: 3m
        labels: {severity: critical}
        annotations: {summary: "tunnel {{ $labels.tunnel }} ({{ $labels.headend }} <-> {{ $labels.spoke }}) is {{ if eq $value 1.0 }}degraded (IKE up, VTI or eBGP not){{ else }}down{{ end }}"}
      - alert: HeadendUnreachable
        expr: (lab_headend_collect_error{lab="cat8000v-ipsec"} == 1) and on (lab) (sum by (lab) (lab_vm_running{role="hub"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "the portal cannot collect live state from {{ $labels.headend }}"}
      - alert: HeadendCapacityExhausted
        expr: lab_headend_effective_free{lab="cat8000v-ipsec"} == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.headend }} has no free tunnel slot left (binding constraint: tunnels, bandwidth or CPU)"}
      - alert: HeadendCpuHigh
        expr: lab_headend_cpu_pct{lab="cat8000v-ipsec"} > 80
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.headend }} control-plane CPU at {{ $value }}%"}
      # IKE certificate authentication: the router certificates the lab CA issued (pki/index.json via the portal's /metrics)
      - alert: CertificateExpiringSoon
        expr: (lab_cert_not_after_seconds{lab="cat8000v-ipsec"} - time()) / 86400 < 30 and (lab_cert_not_after_seconds{lab="cat8000v-ipsec"} - time()) > 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.device }}: router certificate expires in {{ $value | printf \"%.0f\" }} days — renew it (Renew cert… in the portal, or the next deploy's pki step)"}
      - alert: CertificateExpired
        expr: lab_cert_not_after_seconds{lab="cat8000v-ipsec"} - time() <= 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.device }}: router certificate has expired — its tunnels cannot re-authenticate"}
      # configuration compliance: Nautobot Golden Config's verdict per router (the portal exports it and schedules a Golden Config run
      # every GOLDEN_INTERVAL_HOURS, 6 by default) — a router that stays non-compliant has drifted from the model
      # the data-centre interconnect: the DCI's twice-NAT, the aggregates the two sides exchange instead of their overlapping
      # prefixes, and the two DNS zones (portal /metrics <- webapp/interconnect.py). 2002 static translations come from one
      # `scale` block in the intent: 2000 means a chunk of a CLI template did not make it onto the box.
      - alert: NatTranslationsMissing
        expr: (lab_nat_static_translations{lab="cat8000v-ipsec"} < lab_nat_static_translations_expected{lab="cat8000v-ipsec"}) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.router }} holds {{ $value }} static translations, fewer than the model's — overlapping prefixes are unreachable in both directions"}
      - alert: NatDrops
        expr: increase(lab_nat_drops_total{lab="cat8000v-ipsec"}[15m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.router }}: {{ $value | printf \"%.0f\" }} packets dropped {{ $labels.direction }} for want of a translation in the last 15 minutes"}
      - alert: NatAggregateRouteMissing
        expr: (lab_nat_aggregate_route{lab="cat8000v-ipsec"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.router }} has no route for {{ $labels.prefix }} ({{ $labels.kind }}) — the translated range the other side is told to use is not reachable"}
      - alert: DnsZoneShrunk
        expr: (lab_dns_zone_records{lab="cat8000v-ipsec"} < lab_dns_zone_records_expected{lab="cat8000v-ipsec"}) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.router }} answers for {{ $labels.zone }} with {{ $value }} records, fewer than the model's"}
      - alert: DnsServerDown
        expr: (lab_dns_server_up{lab="cat8000v-ipsec"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.router }} no longer answers for {{ $labels.zone }} (ip dns server is gone)"}
      - alert: DnsFixupFailing
        expr: lab_dns_fixup_ok{lab="cat8000v-ipsec"} == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "the last packet capture on both sides of {{ $labels.router }} shows a DNS answer that was NOT translated — a client resolving across the interconnect gets an address it cannot reach"}
      - alert: InterconnectUnreachable
        expr: (lab_interconnect_collect_error{lab="cat8000v-ipsec"} == 1) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "the portal cannot read the interconnect state from {{ $labels.router }}"}
      - alert: ConfigDrift
        expr: lab_config_compliance_ok{lab="cat8000v-ipsec"} == 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.device }} drifted from the model: Nautobot Golden Config reports non-compliant feature(s) — Remediate / Re-apply from the model on the portal's Compliance page"}
      - alert: ConfigComplianceStale
        expr: (time() - lab_config_compliance_last_run_timestamp_seconds{lab="cat8000v-ipsec"}) > 2 * lab_config_compliance_interval_seconds{lab="cat8000v-ipsec"} > 0 and on(lab) max by(lab) (lab_vm_running{lab="cat8000v-ipsec",role="hub"}) == 1
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "cat8000v-ipsec: no Golden Config compliance run for {{ $value | humanizeDuration }} while the lab is up — the portal's scheduled run is not happening"}
