# Alert rules for the labs (evaluated by Prometheus; state visible at :9090/alerts and on the Grafana overview).
groups:
  - name: lab-exporters
    rules:
      - alert: ExporterDown    # only for VMs the portal reports as running: a powered-off lab is a normal state
        expr: (up{job=~"node|frr"} == 0) and on (lab, node) (lab_vm_running == 1)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.job }} exporter on {{ $labels.node }} ({{ $labels.instance }}) not scraped for 2 minutes"}
      - alert: PortalDown
        expr: up{job="portal"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "the {{ $labels.lab }} portal ({{ $labels.instance }}) is not answering"}
      - alert: PortalCollectorStale    # only while the lab runs
        expr: (time() - lab_collector_last_refresh_seconds > 600) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "the {{ $labels.lab }} portal has not refreshed its live state for 10 minutes"}

  - name: srv6-core
    rules:
      - alert: TenantHostUnreachable
        expr: (lab_host_reachable == 0) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.host }} ({{ $labels.tenant }}, {{ $labels.dc }}) does not answer SSH"}
      - alert: TenantSiteBgpDown
        expr: (lab_tenant_site_bgp_up == 0) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.tenant }} {{ $labels.dc }}: eBGP {{ $labels.pe }} - {{ $labels.ce }} is not Established"}
      - alert: LookingGlassCollectorSessionDown
        expr: (lg_session_up == 0) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "BGP looking glass: the collector's session to {{ $labels.peer }} is down — the core's table is no longer being followed"}
      - alert: LookingGlassCollectionFailing
        expr: (lg_poll_ok == 0) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "BGP looking glass: the {{ $labels.source }} view has been failing to collect for 10 min"}
      - alert: LookingGlassStale
        expr: (max by (lab) (lg_poll_age_seconds) > 900) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "BGP looking glass: nothing has been collected for more than 15 minutes (lgd stuck?)"}
      - alert: TenantDegraded
        expr: (lab_tenant_health < 2) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.tenant }} is {{ if eq $value 1.0 }}degraded{{ else }}down{{ end }}"}
      - alert: InternetBreakoutDown
        expr: ((lab_internet_bgp_up == 0) or (lab_internet_default_route == 0) or (lab_internet_fw_reachable == 0)) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "internet breakout: {{ if $labels.pe }}{{ $labels.tenant }} on {{ $labels.pe }}{{ else }}{{ $labels.fw }}{{ end }} — session down, no default route, or the firewall unreachable"}
      - alert: IsisAdjacencyMissing
        expr: (lab_isis_adjacencies_up < lab_isis_adjacencies_expected) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} IS-IS adjacencies up, fewer than its core links"}
      - alert: BfdSessionDown
        expr: (lab_bfd_sessions_up < lab_isis_adjacencies_expected) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: a BFD session is down ({{ $value }} up)"}
      - alert: VpnV4SessionDown
        expr: (lab_vpnv4_session_up == 0) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.pe }}: VPNv4 session to route reflector {{ $labels.reflector }} down"}
      - alert: FrrBgpPeerDown
        expr: (frr_bgp_peer_state{job="frr"} != 1) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: BGP peer {{ $labels.peer }} ({{ $labels.vrf }} {{ $labels.safi }}) not Established"}
      - alert: LabTestsFailed
        expr: lab_tests_last_failed > 0
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.lab }}: {{ $value }} Robot test(s) failed in the last run"}
      - alert: TenantSlaBreach       # the portal probes every pair of a tenant's sites host to host each minute (lab_tenant_*)
        expr: (lab_tenant_sla_ok{lab="srv6-core"} == 0) and (lab_tenant_loss_ratio < 1) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.tenant }} {{ $labels.src }} ({{ $labels.src_dc }}) → {{ $labels.dst }} ({{ $labels.dst_dc }}): outside its SLA for 5 min (delay or loss above target)"}
      - alert: TenantSlaDown
        expr: (lab_tenant_loss_ratio{lab="srv6-core"} == 1) and on (lab) (sum by (lab) (lab_vm_running) > 0)
        for: 3m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.tenant }} {{ $labels.src }} ({{ $labels.src_dc }}) → {{ $labels.dst }} ({{ $labels.dst_dc }}): no answer at all for 3 min"}
      - alert: LabNoRoomForTenant
        expr: lab_capacity_room_tenants{lab="srv6-core", scope="every_dc"} == 0
        for: 30m
        labels: {severity: info}
        annotations: {summary: "srv6-core: no room for another tenant at every data centre — the portal's Capacity view names the limit"}

  - name: nodes
    rules:
      - alert: NodeHighCpu
        expr: 100 * (1 - avg by (node, role, lab) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: CPU {{ $value | printf \"%.0f\" }} % for 10 minutes"}
      - alert: NodeLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: less than 10 % memory available"}
      - alert: NodeDiskFull    # the persistent disk: "/" on the hosts, the persistence mount on VyOS (live-boot overlay)
        expr: node_filesystem_avail_bytes{mountpoint=~"/|/usr/lib/live/mount/persistence",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint=~"/|/usr/lib/live/mount/persistence",fstype!="tmpfs"} < 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: {{ $labels.mountpoint }} under 10 % free"}

  - name: c8000v-dmvpn-lab           # every rule gated on the lab's C8000vs running, so a stopped lab raises nothing, and
    #                                   silent for a node under announced maintenance (lab_maintenance, the portal's maint.py)
    rules:
      - alert: DmvpnCustomerNotRegistered
        expr: ((lab_dmvpn_nhs_up{lab="c8000v-dmvpn-lab"} < lab_dmvpn_nhs_expected{lab="c8000v-dmvpn-lab"}) and on (lab) (sum by (lab) (lab_vm_running{lab="c8000v-dmvpn-lab",role="hub"}) > 0)) unless on (lab, router) (lab_maintenance{lab="c8000v-dmvpn-lab"} == 1)
        for: 3m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.router }} is registered with {{ $value }} hub(s), not all of them — NHRP to the missing hub is down"}
      - alert: DmvpnProviderSessionDown
        expr: ((lab_bgp_underlay_up{lab="c8000v-dmvpn-lab"} < 1) and on (lab) (sum by (lab) (lab_vm_running{lab="c8000v-dmvpn-lab",role="provider"}) > 0)) unless on (lab, router) (lab_maintenance{lab="c8000v-dmvpn-lab"} == 1)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.router }} has no eBGP session with the provider: its NBMA address is withdrawn and its tunnels cannot form"}
      - alert: DmvpnOverlayBgpDown
        expr: ((lab_bgp_overlay_up{lab="c8000v-dmvpn-lab"} < lab_bgp_overlay_sessions{lab="c8000v-dmvpn-lab"}) and on (lab) (sum by (lab) (lab_vm_running{lab="c8000v-dmvpn-lab",role="hub"}) > 0)) unless on (lab, router) (lab_maintenance{lab="c8000v-dmvpn-lab"} == 1)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.router }}: not every overlay iBGP session is Established"}
      - alert: DmvpnRouterUnreachable
        expr: ((lab_router_reachable{lab="c8000v-dmvpn-lab"} == 0) and on (lab, router) label_replace(lab_vm_running{lab="c8000v-dmvpn-lab"} == 1, "router", "$1", "node", "(.*)")) unless on (lab, router) (lab_maintenance{lab="c8000v-dmvpn-lab"} == 1)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "the portal cannot read {{ $labels.router }} over SSH"}
      - alert: DmvpnLanHostDown
        expr: ((lab_host_up{lab="c8000v-dmvpn-lab"} == 0) and on (lab, host) label_replace(lab_vm_running{lab="c8000v-dmvpn-lab"} == 1, "host", "$1", "node", "(.*)")) unless on (lab, host) label_replace(lab_maintenance{lab="c8000v-dmvpn-lab"} == 1, "host", "$1", "router", "(.*)")
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.host }} is running but does not answer on its OOB address"}
      - alert: DmvpnRouterCpuHigh
        expr: (lab_router_cpu_pct{lab="c8000v-dmvpn-lab"} > 80) unless on (lab, router) (lab_maintenance{lab="c8000v-dmvpn-lab"} == 1)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.router }} CPU at {{ $value }}% (one-minute average)"}

  - name: evpn-fabric               # every rule gated on the fabric running (a powered-off lab raises nothing); the portal measures it (webapp/state.py)
    rules:
      - alert: EvpnFabricSessionDown
        expr: (lab_bgp_sessions_up{lab="evpn-fabric",afi="ipv4"} < on (lab, node, role) lab_bgp_sessions_expected{lab="evpn-fabric"}) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-fabric"}) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} fabric BGP session(s) Established, fewer than its fabric ports"}
      - alert: EvpnVtepMissingOnVni
        expr: (lab_evpn_l2vni_remote_vteps{lab="evpn-fabric"} < scalar(count(lab_vm_running{lab="evpn-fabric",role="leaf"} == 1) - 1)) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-fabric"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: L2VNI {{ $labels.vni }} sees {{ $value }} remote VTEPs, not every other leaf"}
      - alert: EvpnSegmentDfNotUnique
        expr: (sum by (lab, esi) (lab_es_df{lab="evpn-fabric"}) != 1) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-fabric"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "Ethernet Segment {{ $labels.esi }} has {{ $value }} designated forwarders (want exactly 1)"}
      - alert: EvpnDefaultRouteDegraded
        expr: (lab_default_route_paths{lab="evpn-fabric",role="leaf"} < 2) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-fabric"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: tenant {{ $labels.tenant }} reaches the outside through {{ $value }} border(s), not both"}
      - alert: EvpnEdgeSessionDown
        expr: (lab_edge_session_up{lab="evpn-fabric"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-fabric"}) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "fw-ext: the session to border address {{ $labels.border_ip }} is down — that tenant leaves through one border"}
      - alert: EvpnServerBondDegraded      # a dual-homed server down to one LACP leg (single-homed servers have no bond: 0 legs)
        expr: (lab_server_bond_legs_up{lab="evpn-fabric"} == 1) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-fabric"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: one LACP leg of two — its Ethernet Segment runs on one leaf"}
      - alert: EvpnNodeUnhealthy
        expr: (lab_node_health{lab="evpn-fabric"} < 1) and on (lab, node) (lab_vm_running{lab="evpn-fabric"} == 1)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }} ({{ $labels.role }}) is degraded or unreachable in the portal's view"}
      # Kubernetes on the fabric (k3s + Cilium on the k8s-* nodes): only while their VMs run
      - alert: EvpnK8sNodeNotReady
        expr: (lab_k8s_node_ready{lab="evpn-fabric"} == 0) and on (lab, node) (lab_vm_running{lab="evpn-fabric"} == 1)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "Kubernetes node {{ $labels.node }} is not Ready"}
      - alert: EvpnK8sBgpSessionDown       # a node announces its pods and services to its two leaves
        expr: (lab_k8s_bgp_sessions_up{lab="evpn-fabric"} < 2) and on (lab, node) (lab_vm_running{lab="evpn-fabric"} == 1)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Kubernetes node {{ $labels.node }} has {{ $value }} of 2 BGP sessions to its leaves"}
      - alert: EvpnK8sServiceUnannounced   # a LoadBalancer service no node announces: unreachable from the fabric
        expr: (lab_k8s_lb_service_announcers{lab="evpn-fabric"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-fabric"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "LoadBalancer service {{ $labels.service }} ({{ $labels.address }}) is announced by no node"}

  - name: evpn-clab                 # VyOS on containerlab; the portal (:8096) measures the fabric. Gated on the lab running, and per node on its container
    rules:
      - alert: EvpnClabOspfAdjacencyDown
        expr: (lab_ospf_neighbors_full{lab="evpn-clab"} < on (lab, node, role) lab_ospf_neighbors_expected{lab="evpn-clab"}) and on (lab, node) (lab_vm_running{lab="evpn-clab"} == 1)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} OSPF adjacencies Full, fewer than its fabric links — the underlay lost a path"}
      - alert: EvpnClabBfdDown
        expr: (lab_bfd_peers_up{lab="evpn-clab"} < on (lab, node, role) lab_bfd_peers_total{lab="evpn-clab"}) and on (lab, node) (lab_vm_running{lab="evpn-clab"} == 1)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} BFD session(s) up, not all"}
      - alert: EvpnClabBgpSessionDown
        expr: (lab_bgp_sessions_up{lab="evpn-clab"} < on (lab, node, role, afi) lab_bgp_sessions_expected{lab="evpn-clab"}) and on (lab, node) (lab_vm_running{lab="evpn-clab"} == 1)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} {{ $labels.afi }} BGP session(s) Established, fewer than expected (evpn: to the route reflectors; ipv4: the border / wan edge)"}
      - alert: EvpnClabVtepMissingOnVni
        expr: (lab_evpn_l2vni_remote_vteps{lab="evpn-clab"} < scalar(count(lab_vm_running{lab="evpn-clab",role="leaf"} == 1) - 1)) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-clab"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: L2VNI {{ $labels.vni }} floods to {{ $value }} remote VTEPs, not every other leaf"}
      - alert: EvpnClabDefaultRouteDegraded
        expr: (lab_default_route_paths{lab="evpn-clab"} < 2) and on (lab, node) (lab_vm_running{lab="evpn-clab"} == 1)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: tenant {{ $labels.tenant }} reaches the outside through {{ $value }} border(s), not both"}
      - alert: EvpnClabSegmentDfNotUnique      # EVPN multihoming: exactly one designated forwarder per Ethernet Segment
        expr: (sum by (lab, esi, host) (lab_es_df{lab="evpn-clab"}) != 1) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-clab"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "Ethernet Segment {{ $labels.esi }} ({{ $labels.host }}) has {{ $value }} designated forwarders (want exactly 1)"}
      - alert: EvpnClabHostBondDegraded        # a dual-homed host down to one LACP leg: its segment runs on one leaf
        expr: (lab_host_bond_legs_up{lab="evpn-clab"} < 2) and on (lab, node) (lab_vm_running{lab="evpn-clab"} == 1)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} of 2 LACP legs in its bond — one leaf carries the whole segment"}
      - alert: EvpnClabAliasingDegraded        # a leaf reaches a segment through one VTEP only
        expr: (lab_es_vteps{lab="evpn-clab"} < 2) and on (lab, node) (lab_vm_running{lab="evpn-clab"} == 1)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: segment {{ $labels.esi }} ({{ $labels.host }}) through {{ $value }} VTEP(s), not both"}
      - alert: EvpnClabFirewallDropping        # the wan's firewall dropping a steady stream between two zones (a scan, a misdirected app)
        expr: (sum by (lab, from, to) (rate(lab_firewall_packets_total{lab="evpn-clab",action="drop"}[5m])) > 1) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-clab"}) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "the wan's firewall drops {{ $value | printf \"%.1f\" }} packets/s from {{ $labels.from }} to {{ $labels.to }}"}
      - alert: EvpnClabNodeRestarted           # Docker restarted a container on its own (OOM, crash): it came back without its links
        expr: (increase(lab_container_restarts{lab="evpn-clab"}[10m]) > 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-clab"}) > 0)
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}'s container restarted on its own and lost its containerlab links — ./lab.sh down && ./lab.sh up"}
      - alert: EvpnClabLinkDown
        expr: (lab_link_up{lab="evpn-clab"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-clab"}) > 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.kind }} link {{ $labels.link }} is down (the portal's view)"}
      - alert: EvpnClabNodeDown        # a node whose container is stopped while the rest of the lab runs
        expr: (lab_vm_running{lab="evpn-clab"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-clab"}) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }} ({{ $labels.role }}) is not running while the rest of evpn-clab is"}
      - alert: EvpnClabVerifyFailing
        expr: (lab_verify_checks_passed{lab="evpn-clab"} < lab_verify_checks_total{lab="evpn-clab"}) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-clab"}) > 0)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "the last ./lab.sh verify passed {{ $value }} checks, not all of them"}

  - name: evpn-pfsense              # VyOS on containerlab + a pfSense pair (red, blue) and an OPNsense pair (green, yellow); the portal (:8098) is the only source. Gated on the lab running
    rules:
      - alert: EvpnPfsenseFirewallDown
        expr: (lab_vm_running{lab="evpn-pfsense",role="firewall"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }} (pfSense) is powered off — its peer carries every VIP alone, without a standby"}
      - alert: EvpnPfsenseFirewallUnhealthy
        expr: (lab_node_health{lab="evpn-pfsense",role="firewall"} == 0) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }} is running but unhealthy: no SSH, a BGP session with a border down, or tenant routes not in its kernel"}
      - alert: EvpnPfsenseCarpNoMaster
        expr: (sum by (lab, pair, vhid, vip) (lab_carp_master{lab="evpn-pfsense"}) == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "no {{ $labels.pair }} firewall is CARP MASTER of the {{ $labels.vip }} VIP (vhid {{ $labels.vhid }}): traffic to it goes nowhere"}
      - alert: EvpnPfsenseCarpSplitBrain
        # split brain: each firewall answers for the VIP, states and replies go astray
        expr: (sum by (lab, pair, vhid, vip) (lab_carp_master{lab="evpn-pfsense"}) > 1) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "both {{ $labels.pair }} firewalls are CARP MASTER of the {{ $labels.vip }} VIP (vhid {{ $labels.vhid }}) — the sync link or CARP between them is broken"}
      - alert: EvpnPfsensePrimaryNotMaster
        # after a failover the primary (pf1, opn1) takes the VIPs back when it returns (preempt)
        expr: (lab_carp_master{lab="evpn-pfsense",node=~"pf1|opn1"} == 0) and on (lab, node) (lab_node_health{lab="evpn-pfsense",node=~"pf1|opn1"} == 1)
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }} (the {{ $labels.pair }} primary) is healthy but not MASTER of the {{ $labels.vip }} VIP for 10 min — demoted on purpose, or preemption did not take it back"}
      - alert: EvpnPfsenseFirewallBgpDown
        expr: (lab_firewall_bgp_up{lab="evpn-pfsense"} == 0) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: BGP with {{ $labels.border }} in tenant {{ $labels.tenant }} is not Established"}
      - alert: EvpnPfsenseFirewallBfdDown
        expr: (lab_firewall_bfd_peers_up{lab="evpn-pfsense"} < on (lab, node, role) lab_firewall_bfd_peers_total{lab="evpn-pfsense"}) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} BFD session(s) with the borders up, not all — a border cut would take ~9 s to notice"}
      - alert: EvpnPfsenseKernelRoutesWrong
        # rc.reload_all once took FRR's routes out of the kernel without zebra noticing
        expr: (lab_firewall_kernel_ok{lab="evpn-pfsense"} == 0) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: a tenant network is not in the kernel out of its VLAN (FRR and the kernel apart?) — traffic goes out of the WAN; restart FRR"}
      - alert: EvpnPfsensePfsyncMaxupd
        # fabric.yml firewall_cluster.pfsync_maxupd; a boot shellcmd sets it
        expr: (lab_pfsync_maxupd{lab="evpn-pfsense"} != 1) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: pfsync maxupd is {{ $value }}, not 1 — a fast TCP stream may not survive a failover"}
      - alert: EvpnPfsenseStateMismatches
        expr: (increase(lab_pf_counter_total{lab="evpn-pfsense",counter="state-mismatch"}[10m]) > 20) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: {{ $value | printf \"%.0f\" }} state mismatches in 10 min — streams dropped as out of window (a failover with stale pfsync state?)"}
      - alert: EvpnPfsenseTenantsBlocked
        expr: (sum by (lab, rule) (rate(lab_firewall_packets_total{lab="evpn-pfsense",rule=~".*blocked"}[5m])) > 1) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "the firewalls block {{ $value | printf \"%.1f\" }} packets/s on \"{{ $labels.rule }}\" — a host keeps trying what the policy forbids"}
      - alert: EvpnPfsenseOspfAdjacencyDown
        expr: (lab_ospf_neighbors_full{lab="evpn-pfsense"} < on (lab, node, role) lab_ospf_neighbors_expected{lab="evpn-pfsense"}) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} OSPF adjacencies Full, fewer than its fabric links"}
      - alert: EvpnPfsenseBfdDown
        expr: (lab_bfd_peers_up{lab="evpn-pfsense"} < on (lab, node, role) lab_bfd_peers_total{lab="evpn-pfsense"}) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} BFD session(s) up, not all"}
      - alert: EvpnPfsenseBgpSessionDown
        expr: (lab_bgp_sessions_up{lab="evpn-pfsense"} < on (lab, node, role, afi) lab_bgp_sessions_expected{lab="evpn-pfsense"}) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} {{ $labels.afi }} BGP session(s) Established, fewer than expected (evpn: the route reflectors; ipv4: both firewalls in each tenant)"}
      - alert: EvpnPfsenseVtepMissingOnVni
        expr: (lab_evpn_l2vni_remote_vteps{lab="evpn-pfsense"} < scalar(count(lab_vm_running{lab="evpn-pfsense",role="leaf"} == 1) - 1)) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: L2VNI {{ $labels.vni }} floods to {{ $value }} remote VTEPs, not every other leaf"}
      - alert: EvpnPfsenseDefaultRouteDegraded
        expr: (lab_default_route_paths{lab="evpn-pfsense"} < 2) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: tenant {{ $labels.tenant }} reaches the firewalls through {{ $value }} border(s), not both"}
      - alert: EvpnPfsenseSegmentDfNotUnique
        expr: (sum by (lab, esi, host) (lab_es_df{lab="evpn-pfsense"}) != 1) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "Ethernet Segment {{ $labels.esi }} ({{ $labels.host }}) has {{ $value }} designated forwarders (want exactly 1)"}
      - alert: EvpnPfsenseHostBondDegraded
        expr: (lab_host_bond_legs_up{lab="evpn-pfsense"} < 2) and on (lab, node) (lab_vm_running{lab="evpn-pfsense"} == 1)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: {{ $value }} of 2 LACP legs in its bond"}
      - alert: EvpnPfsenseNodeRestarted
        expr: (increase(lab_container_restarts{lab="evpn-pfsense"}[10m]) > 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}'s container restarted on its own and lost its containerlab links — ./lab.sh down && ./lab.sh up"}
      - alert: EvpnPfsenseLinkDown
        expr: (lab_link_up{lab="evpn-pfsense"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.kind }} link {{ $labels.link }} is down (the portal's view)"}
      - alert: EvpnPfsenseNodeDown
        expr: (lab_vm_running{lab="evpn-pfsense",role!="firewall"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }} ({{ $labels.role }}) is not running while the rest of evpn-pfsense is"}
      - alert: EvpnPfsenseVerifyFailing
        expr: (lab_verify_checks_passed{lab="evpn-pfsense"} < lab_verify_checks_total{lab="evpn-pfsense"}) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "the last ./lab.sh verify passed {{ $value }} checks, not all of them"}
      - alert: EvpnPfsensePortalNotPolling
        # the portal is this lab's only metrics source
        expr: (time() - lab_collector_last_refresh_seconds{lab="evpn-pfsense"} > 120) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-pfsense"}) > 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "the evpn-pfsense portal has not polled the lab for {{ $value | printf \"%.0f\" }} s — every other alert of this lab is blind"}

  - name: mesh-lab                  # service mesh on k3d (two clusters, label cluster); each portal (:8099 main, :8101 cilium) measures its own through kubectl. Gated on the cluster running; `for` outlasts a
    rules:                          # mesh switch (~1.5 min: the shop restarts into the new data plane)
      - alert: MeshLabAccessUnexpected
        # a probe reached what the policy denies (fail open — e.g. a pod not re-captured after a node restart) or was refused what it allows
        expr: (lab_access_mismatches{lab="mesh-lab"} > 0) and on (lab, cluster) (sum by (lab, cluster) (lab_vm_running{lab="mesh-lab"}) > 0)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.cluster }} cluster: {{ $value }} cell(s) of the access matrix are not what its mesh and policy level should allow — see that cluster's portal (main :8099, cilium :8101)"}
      - alert: MeshLabPodOutsideMesh
        expr: (lab_deploy_in_mesh{lab="mesh-lab"} == 0) and on (lab, cluster) (lab_mesh_info{lab="mesh-lab",mesh!="none"} == 1)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.cluster }} cluster: {{ $labels.deploy }} has a pod outside the mesh's data plane — its traffic is plain and no policy applies to it"}
      - alert: MeshLabDeploymentNotReady
        expr: (lab_deploy_ready_replicas{lab="mesh-lab"} < lab_deploy_replicas{lab="mesh-lab"}) and on (lab, cluster) (sum by (lab, cluster) (lab_vm_running{lab="mesh-lab"}) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.cluster }} cluster: {{ $labels.deploy }}: {{ $value }} replica(s) ready, fewer than it wants"}
      - alert: MeshLabMeshComponentNotReady
        expr: (lab_mesh_component_ready{lab="mesh-lab"} < lab_mesh_component_want{lab="mesh-lab"}) and on (lab, cluster) (sum by (lab, cluster) (lab_vm_running{lab="mesh-lab"}) > 0)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.cluster }} cluster: the mesh's {{ $labels.kind }} {{ $labels.component }} has {{ $value }} pod(s) ready, fewer than it wants"}

  - name: p4-lab                    # BMv2 switches programmed by our own controller (portal :8103). Gated on the lab running; a test cuts a link for
    rules:                          # ~10 s at a time, well under the link alert's `for`
      - alert: P4ControllerDown
        expr: (lab_controller_up{lab="p4-lab"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="p4-lab"}) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "the p4-lab controller's API does not answer: nobody answers ARP / ND for the gateways, reroutes around failures or collects INT"}
      - alert: P4SessionDown
        expr: (lab_p4rt_session_up{lab="p4-lab"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="p4-lab"}) > 0)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.switch }} has no P4Runtime session with the controller (the switch keeps forwarding what it holds)"}
      - alert: P4PipelineNotCurrent
        expr: (lab_p4_pipeline_current{lab="p4-lab"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="p4-lab"}) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.switch }} does not run the compiled fabric.p4 (cookie differs)"}
      - alert: P4LinkDown
        expr: (lab_p4_link_up{lab="p4-lab"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="p4-lab"}) > 0)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "fabric link {{ $labels.link }} carries no probes (both ways): it is out of every ECMP group"}
      - alert: P4NoPath
        expr: (lab_p4_ecmp_group_members{lab="p4-lab"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="p4-lab"}) > 0)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.switch }} has no live path to the switch of group {{ $labels.group }}: its traffic there is dropped (no path)"}
      - alert: P4WriteErrors
        expr: increase(lab_p4_write_errors_total{lab="p4-lab"}[10m]) > 0
        labels: {severity: warning}
        annotations: {summary: "P4Runtime writes to {{ $labels.switch }} failed in the last 10 min (the controller's events say which)"}
      - alert: P4HeavyHitterPoliced
        # informational: the controller polices a heavy hitter of a policed tenant (red) on its leaf
        expr: lab_p4_policed_flows{lab="p4-lab"} > 0
        for: 1m
        labels: {severity: info}
        annotations: {summary: "{{ $labels.switch }} polices {{ $value }} heavy-hitter flow(s) to the configured rate"}
      - alert: P4HopSlow
        # INT: a switch whose median hop latency stays above 5 ms is holding packets (BMv2's input buffer under load)
        expr: lab_p4_int_hop_latency_us{lab="p4-lab",stat="p50"} > 5000
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "INT: {{ $labels.switch }} holds packets {{ $value }} µs (median, last minute)"}

  - name: cat8000v-ipsec
    rules:
      - alert: TunnelDown
        expr: (lab_tunnel_health{lab="cat8000v-ipsec"} < 2) and on (lab) (sum by (lab) (lab_vm_running{role="hub"}) > 0)
        for: 3m
        labels: {severity: critical}
        annotations: {summary: "tunnel {{ $labels.tunnel }} ({{ $labels.headend }} <-> {{ $labels.spoke }}) is {{ if eq $value 1.0 }}degraded (IKE up, VTI or eBGP not){{ else }}down{{ end }}"}
      - alert: HeadendUnreachable
        expr: (lab_headend_collect_error{lab="cat8000v-ipsec"} == 1) and on (lab) (sum by (lab) (lab_vm_running{role="hub"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "the portal cannot collect live state from {{ $labels.headend }}"}
      - alert: HeadendCapacityExhausted
        expr: lab_headend_effective_free{lab="cat8000v-ipsec"} == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.headend }} has no free tunnel slot left (binding constraint: tunnels, bandwidth or CPU)"}
      - alert: HeadendCpuHigh
        expr: lab_headend_cpu_pct{lab="cat8000v-ipsec"} > 80
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.headend }} control-plane CPU at {{ $value }}%"}
      # IKE certificate authentication: the router certificates the lab CA issued (pki/index.json via the portal's /metrics)
      - alert: CertificateExpiringSoon
        expr: (lab_cert_not_after_seconds{lab="cat8000v-ipsec"} - time()) / 86400 < 30 and (lab_cert_not_after_seconds{lab="cat8000v-ipsec"} - time()) > 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.device }}: router certificate expires in {{ $value | printf \"%.0f\" }} days — renew it (Renew cert… in the portal, or the next deploy's pki step)"}
      - alert: CertificateExpired
        expr: lab_cert_not_after_seconds{lab="cat8000v-ipsec"} - time() <= 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.device }}: router certificate has expired — its tunnels cannot re-authenticate"}
      # configuration compliance: Nautobot Golden Config's verdict per router (the portal exports it and schedules a Golden Config run
      # every GOLDEN_INTERVAL_HOURS, 6 by default) — a router that stays non-compliant has drifted from the model
      # the data-centre interconnect: the DCI's twice-NAT, the aggregates the two sides exchange instead of their overlapping
      # prefixes, and the two DNS zones (portal /metrics <- webapp/interconnect.py). 2002 static translations come from one
      # `scale` block in the intent: 2000 means a chunk of a CLI template did not make it onto the box.
      - alert: NatTranslationsMissing
        expr: (lab_nat_static_translations{lab="cat8000v-ipsec"} < lab_nat_static_translations_expected{lab="cat8000v-ipsec"}) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.router }} holds {{ $value }} static translations, fewer than the model's — overlapping prefixes are unreachable in both directions"}
      - alert: NatDrops
        expr: increase(lab_nat_drops_total{lab="cat8000v-ipsec"}[15m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.router }}: {{ $value | printf \"%.0f\" }} packets dropped {{ $labels.direction }} for want of a translation in the last 15 minutes"}
      - alert: NatAggregateRouteMissing
        expr: (lab_nat_aggregate_route{lab="cat8000v-ipsec"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.router }} has no route for {{ $labels.prefix }} ({{ $labels.kind }}) — the translated range the other side is told to use is not reachable"}
      - alert: DnsZoneShrunk
        expr: (lab_dns_zone_records{lab="cat8000v-ipsec"} < lab_dns_zone_records_expected{lab="cat8000v-ipsec"}) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.router }} answers for {{ $labels.zone }} with {{ $value }} records, fewer than the model's"}
      - alert: DnsServerDown
        expr: (lab_dns_server_up{lab="cat8000v-ipsec"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.router }} no longer answers for {{ $labels.zone }} (ip dns server is gone)"}
      - alert: DnsFixupFailing
        expr: lab_dns_fixup_ok{lab="cat8000v-ipsec"} == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "the last packet capture on both sides of {{ $labels.router }} shows a DNS answer that was NOT translated — a client resolving across the interconnect gets an address it cannot reach"}
      - alert: InterconnectUnreachable
        expr: (lab_interconnect_collect_error{lab="cat8000v-ipsec"} == 1) and on (lab) (sum by (lab) (lab_vm_running{lab="cat8000v-ipsec",role="dci"}) > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "the portal cannot read the interconnect state from {{ $labels.router }}"}
      - alert: ConfigDrift
        expr: lab_config_compliance_ok{lab="cat8000v-ipsec"} == 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.device }} drifted from the model: Nautobot Golden Config reports non-compliant feature(s) — Remediate / Re-apply from the model on the portal's Compliance page"}
      - alert: ConfigComplianceStale
        expr: (time() - lab_config_compliance_last_run_timestamp_seconds{lab="cat8000v-ipsec"}) > 2 * lab_config_compliance_interval_seconds{lab="cat8000v-ipsec"} > 0 and on(lab) max by(lab) (lab_vm_running{lab="cat8000v-ipsec",role="hub"}) == 1
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "cat8000v-ipsec: no Golden Config compliance run for {{ $value | humanizeDuration }} while the lab is up — the portal's scheduled run is not happening"}

  - name: srl-evpn                  # Nokia SR Linux 5-stage Clos over gNMI (gnmic-srl-evpn). When the lab is down its series expire (60 s), so
    rules:                          # nothing fires; a node that stops answering while the rest run shows as its sessions' peers going down
      - alert: SrlEvpnBgpSessionDown
        expr: srl_bgp_session_state{lab="srl-evpn"} == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: BGP to {{ $labels.neighbor_peer_address }} ({{ $labels.network_instance_name }}) is not established"}
      - alert: SrlEvpnBfdDown
        expr: srl_bfd_session_state{lab="srl-evpn"} == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: a BFD session is down"}
      - alert: SrlEvpnInterfaceDown         # enabled ports only (they report counters); the chassis' unused ports are down by design
        expr: (srl_iface_oper_state{lab="srl-evpn"} == 0) and on (node, interface_name) srl_iface_in_octets{lab="srl-evpn"}
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }} {{ $labels.interface_name }} is down"}
      - alert: SrlEvpnSegmentDown
        expr: srl_es_oper_state{lab="srl-evpn"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.node }}: Ethernet Segment {{ $labels.ethernet_segment_name }} is down (its dual-homed host is down to one leaf)"}
      - alert: SrlEvpnNodeCpuHigh
        expr: srl_system_average_1{lab="srl-evpn"} > 90
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: CPU {{ $value | printf \"%.0f\" }} % for 10 minutes"}
      - alert: SrlEvpnNodeMemoryHigh
        expr: srl_system_utilization{lab="srl-evpn"} > 90
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }}: memory {{ $value | printf \"%.0f\" }} % used"}

  - name: evpn-prefect              # the fabric Prefect builds and runs (portal :8105). incident: "true" routes an alert to the lab's portal through
    rules:                          # Alertmanager — it becomes a Prefect event and starts fabric-diagnose. Gated on the lab running; quiet while a
      - alert: EvpnPrefectPortalDown  # switch is in maintenance where the alert is about the fabric
        expr: up{lab="evpn-prefect",job="portal"} == 0
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "the evpn-prefect portal does not answer the scrape (no metrics, no change requests, no event bridge)"}
      - alert: EvpnPrefectPrefectDown
        expr: (lab_prefect_up{lab="evpn-prefect"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-prefect"}) > 0)
        for: 3m
        labels: {severity: critical}
        annotations: {summary: "Prefect's API does not answer: no flow runs — no changes, no checks, no remediation"}
      - alert: EvpnPrefectNoWorker
        expr: (lab_prefect_workers_online{lab="evpn-prefect"} == 0) and on (lab) (lab_prefect_up{lab="evpn-prefect"} == 1)
        for: 3m
        labels: {severity: critical}
        annotations: {summary: "no worker polls the work pool fabric: runs are scheduled and never start"}
      - alert: EvpnPrefectFabricChecksFailing
        expr: (lab_fabric_checks{lab="evpn-prefect",result="fail"} > 0) and on (lab) (sum by (lab) (lab_switch_maintenance{lab="evpn-prefect"}) == 0)
        for: 1m
        labels: {severity: critical, incident: "true"}
        annotations: {summary: "the last fabric validation failed {{ $value }} checks"}
      - alert: EvpnPrefectSwitchDrift
        expr: (lab_switch_drift_lines{lab="evpn-prefect"} > 0) and on (lab, switch) (lab_switch_maintenance{lab="evpn-prefect"} == 0)
        for: 15m
        labels: {severity: warning, incident: "true"}
        annotations: {summary: "{{ $labels.switch }} differs from the applied intent by {{ $value }} lines (and nobody remediated it)"}
      - alert: EvpnPrefectSwitchExporterDown
        expr: (up{lab="evpn-prefect",job=~"node|frr"} == 0) and on (lab, node) (label_replace(lab_switch_maintenance{lab="evpn-prefect"}, "node", "$1", "switch", "(.*)") == 0)
        for: 3m
        labels: {severity: warning, incident: "true", switch: "{{ $labels.node }}"}
        annotations: {summary: "{{ $labels.node }}'s {{ $labels.job }}-exporter does not answer (the switch, or its management, is down)"}
      - alert: EvpnPrefectRunFailed
        expr: lab_prefect_last_run_ok{lab="evpn-prefect"} == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "the last {{ $labels.deployment }} run ended {{ $labels.state }}"}
      - alert: EvpnPrefectApprovalWaiting
        expr: lab_prefect_runs_waiting_approval{lab="evpn-prefect"} > 0
        for: 30m
        labels: {severity: info}
        annotations: {summary: "{{ $value }} {{ $labels.deployment }} run(s) waiting for approval for over 30 min (the portal's Change requests card)"}
      - alert: EvpnPrefectMaintenanceTooLong
        expr: lab_switch_maintenance{lab="evpn-prefect"} == 1
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.switch }} has been drained for maintenance for over an hour (drift checks and diagnoses stand down meanwhile)"}
      - alert: EvpnPrefectEventBridgeDown
        expr: (lab_eventd_up{lab="evpn-prefect"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-prefect"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "eventd does not answer: switch syslog is not turned into events (no diagnosis on a lost adjacency)"}
      - alert: EvpnPrefectLogsNotShipping
        expr: lab_vlogs_ship_ok{lab="evpn-prefect"} == 0
        for: 10m
        labels: {severity: info}
        annotations: {summary: "the portal cannot ship flow runs, flow logs and switch events to VictoriaLogs"}

  - name: evpn-nodered              # the fabric Node-RED builds and runs (portal :8107). incident: "true" routes an alert through Alertmanager to Node-RED's
    rules:                          # /hooks/alertmanager — it starts fabric-diagnose. Gated on the lab running; quiet while a switch is in maintenance
      - alert: EvpnNodeRedPortalDown
        expr: up{lab="evpn-nodered",job="portal"} == 0
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "evpn-nodered's portal (:8107) does not answer"}
      - alert: EvpnNodeRedNodeRedDown
        expr: (lab_nodered_up{lab="evpn-nodered"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="evpn-nodered"}) > 0)
        for: 3m
        labels: {severity: critical}
        annotations: {summary: "Node-RED (:1880) does not answer while the lab runs"}
      - alert: EvpnNodeRedFabricChecksFailing
        expr: (lab_fabric_checks{lab="evpn-nodered",result="fail"} > 0) and on (lab) (sum by (lab) (lab_switch_maintenance{lab="evpn-nodered"}) == 0)
        for: 1m
        labels: {severity: critical, incident: "true"}
        annotations: {summary: "{{ $value }} of the fabric's checks fail (the last validation)"}
      - alert: EvpnNodeRedSwitchDrift
        expr: (lab_switch_drift_lines{lab="evpn-nodered"} > 0) and on (lab, switch) (lab_switch_maintenance{lab="evpn-nodered"} == 0)
        for: 15m
        labels: {severity: warning, incident: "true"}
        annotations: {summary: "{{ $labels.switch }} differs from the applied intent by {{ $value }} lines"}
      - alert: EvpnNodeRedSwitchExporterDown
        expr: (up{lab="evpn-nodered",job=~"node|frr"} == 0) and on (lab, node) (label_replace(lab_switch_maintenance{lab="evpn-nodered"}, "node", "$1", "switch", "(.*)") == 0)
        for: 3m
        labels: {severity: warning, incident: "true", switch: "{{ $labels.node }}"}
        annotations: {summary: "{{ $labels.node }}'s {{ $labels.job }} exporter does not answer"}
      - alert: EvpnNodeRedWorkflowFailed
        expr: lab_workflow_last_ok{lab="evpn-nodered",workflow=~"fabric-build|fabric-validate|switch-upgrade|rolling-upgrade"} == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.workflow }}'s last run ended {{ $labels.state }}"}
      - alert: EvpnNodeRedApprovalWaiting
        expr: lab_runs_waiting_approval{lab="evpn-nodered"} > 0
        for: 30m
        labels: {severity: info}
        annotations: {summary: "{{ $value }} runs wait for a person's decision (dashboard, portal, ./lab.sh changes)"}
      - alert: EvpnNodeRedMaintenanceTooLong
        expr: lab_switch_maintenance{lab="evpn-nodered"} == 1
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.switch }} has been in maintenance for over an hour"}
      - alert: EvpnNodeRedDriftNotChecked
        expr: (lab_drift_check_age_seconds{lab="evpn-nodered"} > 1800) and on (lab) (lab_nodered_up{lab="evpn-nodered"} == 1)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "no drift check for {{ $value | humanizeDuration }} (scheduled every 10 minutes)"}
      - alert: EvpnNodeRedLogsNotShipping
        expr: lab_vlogs_ship_ok{lab="evpn-nodered"} == 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "the portal cannot ship runs and events to VictoriaLogs"}

  - name: homa-lab                  # Homa kernel module lab (portal :8108). Gated on the lab running. The tests and the portal's measurements unload the
    rules:                          # module for seconds, change sw1 and the timers and cause timeouts on purpose: homa_lab_run_active says when
      - alert: HomaModuleNotLoaded
        expr: (homa_module_loaded{lab="homa-lab"} == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="homa-lab",role="host"}) > 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "homa.ko is not loaded on {{ $labels.node }}: no Homa sockets there (./lab.sh homa load)"}
      - alert: HomaTimersDiffer
        expr: (max by (lab) (homa_resend_ticks{lab="homa-lab"}) != min by (lab) (homa_resend_ticks{lab="homa-lab"})) and on (lab) (homa_lab_run_active == 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "the homa-lab hosts run different resend timers: results depend on which host receives (set a preset in the portal)"}
      - alert: HomaLinkRateMismatch
        expr: (homa_link_mbps{lab="homa-lab"} != 1000) and on (lab) (homa_lab_run_active == 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }} has net.homa.link_mbps {{ $value }}, not sw1's 1000: its pacer and grants assume the wrong bottleneck"}
      - alert: HomaRpcTimeouts
        # informational outside runs: an RPC given up on while nobody is loading the network on purpose
        expr: (increase(homa_counter_total{lab="homa-lab",counter="rpc_timeouts"}[10m]) > 0) and on (lab) (max_over_time(homa_lab_run_active[10m]) == 0)
        labels: {severity: info}
        annotations: {summary: "{{ $labels.node }} gave up on {{ $value | humanize }} Homa RPC(s) in the last 10 min with no test or measurement running"}
      - alert: HomaTestsFailing
        expr: lab_tests_last_failed{lab="homa-lab"} > 0
        labels: {severity: warning}
        annotations: {summary: "the last homa-lab Robot run had {{ $value }} failed test(s) (portal: Last tests)"}

  - name: srv6-xr                   # multi-vendor SRv6 L3VPN lab (portal :8109). The metrics exist only while the lab runs (the portal polls nothing when it is
    rules:                          # off). A link failed from the portal, and the test runs (suite 06 fails p1 - p2), take adjacencies down on purpose
      - alert: Srv6XrRouterUnreachable
        expr: srv6xr_router_reachable{lab="srv6-xr"} == 0
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "the srv6-xr portal cannot reach {{ $labels.node }} ({{ $labels.os }}) over SSH: no state for it"}
      - alert: Srv6XrIsisAdjacencyDown
        expr: (srv6xr_isis_adjacency_up{lab="srv6-xr"} == 0) and on (lab) (srv6xr_run_active == 0) and on (lab) (sum by (lab) (srv6xr_link_failed) == 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }} has no IS-IS adjacency with {{ $labels.peer }} (no link was failed on purpose)"}
      - alert: Srv6XrBgpSessionDown
        expr: (srv6xr_bgp_established{lab="srv6-xr"} == 0) and on (lab) (srv6xr_run_active == 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.pe }}'s {{ $labels.family }} session with the route reflector is down: its VPN routes are gone"}
      - alert: Srv6XrTenantUnreachable
        expr: (srv6xr_tenant_reachable{lab="srv6-xr",same_tenant="true"} == 0) and on (lab) (srv6xr_run_active == 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.src }} cannot reach {{ $labels.dst }} ({{ $labels.af }}) in its own tenant VPN across the core"}
      - alert: Srv6XrTenantLeak
        # the worst outcome: traffic crossing between the tenant VRFs
        expr: srv6xr_tenant_reachable{lab="srv6-xr",same_tenant="false"} == 1
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.src }} reaches {{ $labels.dst }} ({{ $labels.af }}) in the OTHER tenant: the VRFs leak (route targets?)"}
      - alert: Srv6XrTePolicyDown
        # a policy that is enabled but not up: its tenants fall back to the IGP path (a shut policy, admin="false", is on purpose)
        expr: (srv6xr_te_policy_up{lab="srv6-xr",admin="true"} == 0) and on (lab) (srv6xr_run_active == 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "xr-pe1's SR policy {{ $labels.policy }} (colour {{ $labels.color }}) is down: its tenants take the IGP path"}
      - alert: Srv6XrPollStale
        expr: (time() - srv6xr_poll_timestamp_seconds{lab="srv6-xr"} > 300) and on (lab) (srv6xr_run_active == 0) and on (lab) (sum by (lab) (lab_vm_running{lab="srv6-xr"}) > 0)
        for: 5m
        labels: {severity: info}
        annotations: {summary: "the srv6-xr portal has not polled its routers for {{ $value | humanizeDuration }} with no run going"}
      - alert: Srv6XrTestsFailing
        expr: lab_tests_last_failed{lab="srv6-xr"} > 0
        labels: {severity: warning}
        annotations: {summary: "the last srv6-xr Robot run had {{ $value }} failed test(s) (portal: Tests)"}
      # xr-pe1 over gNMI (job srv6-xr-gnmi): what XR streams itself. IS-IS, BGP and the SR policies are already alerted on
      # from the portal's poll above; these add what only the telemetry sees
      - alert: Srv6XrGnmiSilent
        # XR's YANG layer loads a few minutes after a boot (gNMI answers "Server not ready" until then): hence the 15 m
        expr: (lab_vm_running{lab="srv6-xr",node="xr-pe1"} == 1) unless on (lab, node) xr_system_cpu_1m
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "xr-pe1 is running but streams no gNMI telemetry (gnmic-srv6-xr, the host's srv6-xr-gnmi-relay unit, XR's grpc config?)"}
      - alert: Srv6XrInterfaceDown
        # a failed link from the portal is packet loss (netem) and leaves the port up: down here is a real fault
        expr: (xr_iface_oper_up{lab="srv6-xr",peer!="oob"} == 0) and on (lab) (srv6xr_run_active == 0)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "xr-pe1 {{ $labels.interface }} (to {{ $labels.peer }}) is down"}
      - alert: Srv6XrBfdSessionDown
        # XR drops a down session from its list instead of reporting it down: a core port (a P router as peer) with no session up
        expr: (sum by (lab, node, peer) (xr_iface_oper_up{lab="srv6-xr",peer=~"p[0-9]+"}) unless on (lab, node, peer) (xr_bfd_session_up == 1)) and on (lab) (srv6xr_run_active == 0) and on (lab) (sum by (lab) (srv6xr_link_failed) == 0)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "xr-pe1 has no BFD session up to {{ $labels.peer }} (no link was failed on purpose)"}
      - alert: Srv6XrInterfaceErrors
        expr: (rate(xr_iface_in_errors{lab="srv6-xr"}[5m]) + rate(xr_iface_out_errors{lab="srv6-xr"}[5m])) > 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "xr-pe1 {{ $labels.interface }} (to {{ $labels.peer }}) counts errors: {{ $value | humanize }}/s"}
      - alert: Srv6XrCpuHigh
        expr: xr_system_cpu_5m{lab="srv6-xr"} > 80
        for: 15m
        labels: {severity: info}
        annotations: {summary: "xr-pe1 {{ $labels.location }} CPU at {{ $value }}% (5-minute average)"}

  - name: openstack-lab             # OpenStack lab (portal :8110). The cloud's metrics exist only while all three VMs run. The evacuation suite powers
    rules:                          # osl-cmp2 off and forces its nova-compute down on purpose: openstack_lab_run_active says a run is going
      - alert: OpenstackServiceDown
        expr: (openstack_service_up{lab="openstack-lab"} == 0) and on (lab) (openstack_lab_run_active == 0)
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.service }} on {{ $labels.host }} is down (Nova / Cinder service or Neutron agent)"}
      - alert: OpenstackContainersUnhealthy
        expr: (openstack_containers{lab="openstack-lab",state="bad"} > 0) and on (lab) (openstack_lab_run_active == 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $value }} Kolla container(s) on {{ $labels.node }} exited or unhealthy (sudo docker ps -a there)"}
      - alert: OpenstackNestedKvmMissing
        expr: openstack_nested_kvm{lab="openstack-lab"} == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }} has no /dev/kvm: instances there would be emulated or fail to boot (host-passthrough CPU, kvm_amd nested=1)"}
      - alert: OpenstackComputeMemoryLow
        expr: openstack_compute_mem_available_mib{lab="openstack-lab"} / openstack_compute_mem_total_mib{lab="openstack-lab"} < 0.1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.node }} has under 10% memory left for its nested guests ({{ $value | humanizePercentage }})"}
      - alert: OpenstackInstanceError
        expr: openstack_instances{lab="openstack-lab",status="ERROR"} > 0
        for: 5m
        labels: {severity: info}
        annotations: {summary: "{{ $value }} instance(s) in ERROR on {{ $labels.host }}"}
      - alert: OpenstackTestsFailing
        expr: lab_tests_last_failed{lab="openstack-lab"} > 0
        labels: {severity: warning}
        annotations: {summary: "the last openstack-lab Robot run had {{ $value }} failed test(s) (portal: Last tests)"}
