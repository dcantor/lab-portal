# Targets come from each lab portal's HTTP service discovery (/api/sd): every VyOS node-exporter (:9100) and frr-exporter
# (:9342), every tenant host's node-exporter and the portal itself (/metrics: tenant health, IS-IS / BFD, VPNv4 sessions,
# test results). The SD labels (lab, node, role, dc, tenant, job) override the scrape job's own.
global:
  scrape_interval: 30s
  scrape_timeout: 20s
  evaluation_interval: 30s
  external_labels: {site: nms}

rule_files: [alerts.yml]

alerting:                                                            # Alertmanager (alertmanager/alertmanager.yml): it routes evpn-prefect's and
  alertmanagers:                                                     # evpn-nodered's incident alerts to the labs (-> fabric-diagnose) and drops the rest
    - static_configs: [{targets: ["alertmanager:9093"]}]

remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    queue_config: {max_samples_per_send: 5000, batch_send_deadline: 5s}

scrape_configs:
  - job_name: srv6-core
    http_sd_configs: [{url: http://10.3.0.1:8091/api/sd, refresh_interval: 60s}]
    honor_labels: true                                               # the portals label their own gauges (node, role, tenant): those win over the SD labels
    relabel_configs:
      - {source_labels: [__address__], target_label: instance}     # keep ip:port as the instance
    metric_relabel_configs:                                          # node-exporter: drop what a lab never looks at
      - {source_labels: [__name__], regex: "node_(scrape_collector|textfile|entropy|timex|nfs|schedstat|softnet|arp).*", action: drop}

  - job_name: cat8000v-ipsec
    http_sd_configs: [{url: http://10.2.0.1:8090/api/sd, refresh_interval: 60s}]
    honor_labels: true
    relabel_configs:
      - {source_labels: [__address__], target_label: instance}

  - job_name: c8000v-dmvpn-lab                                      # C8000v DMVPN: the portal measures the C8000vs (IOS-XE has no exporter);
    http_sd_configs: [{url: http://10.5.0.1:8094/api/sd, refresh_interval: 60s}]   # the VyOS provider and the Alpine hosts are scraped directly
    honor_labels: true
    relabel_configs:
      - {source_labels: [__address__], target_label: instance}
    metric_relabel_configs:
      - {source_labels: [__name__], regex: "node_(scrape_collector|textfile|entropy|timex|nfs|schedstat|softnet|arp).*", action: drop}

  - job_name: evpn-fabric                                          # EVPN/VXLAN leaf-spine on VyOS: every node-exporter / frr-exporter, the
    http_sd_configs: [{url: http://10.106.0.1:8095/api/sd, refresh_interval: 60s}]   # servers' node-exporters and the portal (the NMS's eth6 on evpn-oob)
    honor_labels: true
    relabel_configs:
      - {source_labels: [__address__], target_label: instance}
    metric_relabel_configs:
      - {source_labels: [__name__], regex: "node_(scrape_collector|textfile|entropy|timex|nfs|schedstat|softnet|arp).*", action: drop}

  - job_name: evpn-clab                                            # EVPN/VXLAN leaf-spine on VyOS containers (containerlab): the nodes' node- and
    http_sd_configs: [{url: http://10.0.0.1:8096/api/sd, refresh_interval: 60s}]   # frr-exporters on 172.20.108.0/24 (reached through the host) and the portal
    honor_labels: true
    relabel_configs:
      - {source_labels: [__address__], target_label: instance}
    metric_relabel_configs:
      - {source_labels: [__name__], regex: "node_(scrape_collector|textfile|entropy|timex|nfs|schedstat|softnet|arp).*", action: drop}

  - job_name: evpn-pfsense                                         # EVPN on VyOS containers + a pfSense HA pair (KVM): the portal measures both — the fabric
    static_configs: [{targets: ["10.0.0.1:8098"]}]                 # through docker exec, the firewalls over SSH (CARP, BGP, BFD, pfsync, pf); no exporters
    honor_labels: true
    scrape_interval: 30s

  - job_name: mesh-lab                                             # service mesh on k3d (Istio ambient / sidecars, Linkerd; Cilium on a second cluster):
    static_configs:                                                # a portal per cluster measures it, the access matrix and each mesh's latency through
      - {targets: ["10.0.0.1:8099"], labels: {cluster: main}}      # kubectl; no exporters
      - {targets: ["10.0.0.1:8101"], labels: {cluster: cilium}}
    honor_labels: true
    scrape_interval: 30s

  - job_name: p4-lab                                               # our own switch: BMv2 + P4Runtime on containerlab — the portal (:8103) reads the
    static_configs: [{targets: ["10.0.0.1:8103"]}]                 # controller: sessions, links (probes), ECMP groups, ports, drops, punts, and INT
    honor_labels: true                                             # (per-switch hop latency, flows per spine, path latency per host pair); INT's per-flow
    scrape_interval: 30s                                           # records go to VictoriaLogs (lab=p4-lab, type=INT) from the portal

  - job_name: evpn-prefect                                         # EVPN/VXLAN on VyOS containers built and run by Prefect flows (containerlab): every
    http_sd_configs: [{url: http://10.0.0.1:8105/api/sd, refresh_interval: 60s}]   # switch's node- and frr-exporter (172.20.118.0/24, through the host)
    honor_labels: true                                             # and the portal (Prefect, flow runs, drift, checks, versions, maintenance, eventd)
    relabel_configs:
      - {source_labels: [__address__], target_label: instance}
    metric_relabel_configs:
      - {source_labels: [__name__], regex: "node_(scrape_collector|textfile|entropy|timex|nfs|schedstat|softnet|arp).*", action: drop}

  - job_name: evpn-nodered                                         # the same fabric built and run by Node-RED flows (containerlab): every switch's
    http_sd_configs: [{url: http://10.0.0.1:8107/api/sd, refresh_interval: 60s}]   # node- and frr-exporter (172.20.120.0/24, through the host)
    honor_labels: true                                             # and the portal (Node-RED, workflow outcomes, checks, drift, maintenance, versions)
    relabel_configs:
      - {source_labels: [__address__], target_label: instance}
    metric_relabel_configs:
      - {source_labels: [__name__], regex: "node_(scrape_collector|textfile|entropy|timex|nfs|schedstat|softnet|arp).*", action: drop}

  - job_name: srl-evpn                                             # Nokia SR Linux 5-stage Clos (containerlab): gNMI streaming telemetry, every SR
    static_configs: [{targets: ["gnmic-srl-evpn:9804"]}]            # Linux node subscribed by gnmic (gnmic/srl-evpn.yml); its labels lab / node / role / pod
    honor_labels: true
    metric_relabel_configs:
      - {regex: "source|subscription_name", action: labeldrop}   # node says it; the subscription is in the name

  - job_name: lab-host                                             # the Ubuntu KVM host itself (node_exporter as a user service on the OOB bridge)
    static_configs:
      - targets: [10.0.0.1:9100]
        labels: {lab: lab-host, node: ubuntu, role: hypervisor}
    metric_relabel_configs:
      - {source_labels: [__name__], regex: "node_(scrape_collector|textfile|entropy|timex|nfs|schedstat|softnet|arp).*", action: drop}

  - job_name: monitoring
    static_configs:
      - targets: [prometheus:9090]
        labels: {component: prometheus}
      - targets: [victoriametrics:8428]
        labels: {component: victoriametrics}
      - targets: [grafana:3001]
        labels: {component: grafana}
      - targets: [victorialogs:9428]
        labels: {component: victorialogs}
      - targets: [vmalert-logs:8880]
        labels: {component: vmalert-logs}
      - targets: [goflow2:8080]
        labels: {component: goflow2}
