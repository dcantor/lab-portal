# goflow2 writes one JSON object per sampled flow to /flows/flows.json; ship them into VictoriaLogs as structured records.
# evpn-clab has a goflow2 of its own (UDP 6344, /flows/evpn-clab.json): its records are named by evpn-clab.lua first.
[SERVICE]
    Flush        5
    Log_Level    warn
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name             tail
    Path             /flows/flows.json
    Parser           json
    Tag              flows
    Refresh_Interval 5
    Rotate_Wait      10
    Mem_Buf_Limit    64MB
    Skip_Long_Lines  On
    DB               /flows/fluent-bit.db

[INPUT]
    Name             tail
    Path             /flows/evpn-clab.json
    Parser           json
    Tag              flows.evpn-clab
    Refresh_Interval 5
    Rotate_Wait      10
    Mem_Buf_Limit    64MB
    Skip_Long_Lines  On
    DB               /flows/fluent-bit-evpn-clab.db

[FILTER]
    Name             lua
    Match            flows.evpn-clab
    Script           /etc/flows/evpn-clab.lua
    Call             enrich

[OUTPUT]
    Name               http
    Match              flows
    Host               victorialogs
    Port               9428
    URI                /insert/jsonline?_stream_fields=sampler_address,type&_time_field=time_received_ns&_msg_field=type
    Format             json_lines
    Json_Date_Key      false
    Retry_Limit        3

[OUTPUT]
    Name               http
    Match              flows.evpn-clab
    Host               victorialogs
    Port               9428
    URI                /insert/jsonline?_stream_fields=lab,node&_time_field=time_received_ns&_msg_field=msg
    Format             json_lines
    Json_Date_Key      false
    Retry_Limit        3
