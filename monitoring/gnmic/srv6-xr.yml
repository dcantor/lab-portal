# Generated by gen_srv6_xr.py from /home/dcantor/srv6-xr/lab.conf (lab.sh inventory) — do not edit
username: lab
password: lab@XR123
insecure: true
encoding: json_ietf
log: true
targets:
  xr-pe1:
    address: 10.0.0.1:57409
subscriptions:
  iface:
    paths:
    - openconfig-interfaces:/interfaces/interface/state/oper-status
    - openconfig-interfaces:/interfaces/interface/state/counters
    mode: stream
    stream-mode: sample
    sample-interval: 10s
  isis:
    paths:
    - Cisco-IOS-XR-clns-isis-oper:/isis/instances/instance/neighbors/neighbor/neighbor-state
    mode: stream
    stream-mode: sample
    sample-interval: 10s
  bgp:
    paths:
    - Cisco-IOS-XR-ipv4-bgp-oper:/bgp/instances/instance/instance-active/default-vrf/afs/af/neighbor-af-table/neighbor
    mode: stream
    stream-mode: sample
    sample-interval: 10s
  bfd:
    paths:
    - Cisco-IOS-XR-ip-bfd-oper:/bfd/ipv6-single-hop-session-briefs/ipv6-single-hop-session-brief/state
    mode: stream
    stream-mode: sample
    sample-interval: 10s
  te:
    paths:
    - Cisco-IOS-XR-infra-xtc-agent-oper:/xtc/policies/policy/administrative-up
    - Cisco-IOS-XR-infra-xtc-agent-oper:/xtc/policies/policy/operational-up
    - Cisco-IOS-XR-infra-xtc-agent-oper:/xtc/policies/policy/color
    - Cisco-IOS-XR-infra-xtc-agent-oper:/xtc/policies/policy/destination-address
    mode: stream
    stream-mode: sample
    sample-interval: 10s
  system:
    paths:
    - Cisco-IOS-XR-wdsysmon-fd-oper:/system-monitoring/cpu-utilization/total-cpu-one-minute
    - Cisco-IOS-XR-wdsysmon-fd-oper:/system-monitoring/cpu-utilization/total-cpu-five-minute
    - Cisco-IOS-XR-nto-misc-oper:/memory-summary/nodes/node/summary/free-physical-memory
    - Cisco-IOS-XR-nto-misc-oper:/memory-summary/nodes/node/summary/system-ram-memory
    mode: stream
    stream-mode: sample
    sample-interval: 10s
processors:
  lab-names:
    event-starlark:
      source: "\nPEER_BY_IF = {\"GigabitEthernet0/0/0/0\": \"p1\", \"GigabitEthernet0/0/0/1\": \"p3\", \"GigabitEthernet0/0/0/2\": \"ta-h1\", \"GigabitEthernet0/0/0/3\": \"tb-h1\", \"MgmtEth0/RP0/CPU0/0\"\
        : \"oob\"}\nTENANT_BY_IF = {\"GigabitEthernet0/0/0/2\": \"tenant-a\", \"GigabitEthernet0/0/0/3\": \"tenant-b\"}\nNAME_BY_SYSID = {\"0000.0000.0001\": \"xr-pe1\", \"0000.0000.0002\": \"vy-pe2\",\
        \ \"0000.0000.0011\": \"p1\", \"0000.0000.0012\": \"p2\", \"0000.0000.0013\": \"p3\", \"0000.0000.0030\": \"rr\"}\nNAME_BY_ADDR = {\"fd00:9::1\": \"xr-pe1\", \"fd00:9::11\": \"p1\", \"fd00:9::12\"\
        : \"p2\", \"fd00:9::13\": \"p3\", \"fd00:9::2\": \"vy-pe2\", \"fd00:9::30\": \"rr\"}\nPOLICY_BY_COLOR = {\"100\": \"VIA-P3\", \"200\": \"VIA-P1-P3\"}\nUP = [\"UP\", \"isis-adj-up-state\", \"bgp-st-estab\"\
        , \"bfd-mgmt-session-state-up\"]\nIFACE = {\"in-octets\": \"in_octets\", \"out-octets\": \"out_octets\", \"in-pkts\": \"in_pkts\", \"out-pkts\": \"out_pkts\",\n         \"in-errors\": \"in_errors\"\
        , \"out-errors\": \"out_errors\", \"in-discards\": \"in_discards\", \"out-discards\": \"out_discards\"}\nSYSTEM = {\"total-cpu-one-minute\": \"cpu_1m\", \"total-cpu-five-minute\": \"cpu_5m\",\n\
        \          \"free-physical-memory\": \"memory_free_bytes\", \"system-ram-memory\": \"memory_total_bytes\"}\n\ndef leaf(k):\n    return k.split(\"/\")[-1]\n\ndef tag(e, suffix):\n    for k, v in\
        \ e.tags.items():\n        if k.endswith(suffix):\n            return v\n    return \"\"\n\ndef up(v):\n    return 1.0 if v in UP else 0.0\n\ndef apply(*events):\n    out = []\n    for e in events:\n\
        \        sub = e.tags.get(\"subscription-name\", \"\")\n        t = {\"lab\": 'srv6-xr', \"node\": 'xr-pe1', \"subscription-name\": sub}\n        vals = {}\n        if sub == \"iface\":\n      \
        \      i = tag(e, \"interface_name\")\n            t[\"interface\"] = i\n            t[\"peer\"] = PEER_BY_IF.get(i, \"\")\n            t[\"tenant\"] = TENANT_BY_IF.get(i, \"\")\n            if\
        \ not t[\"peer\"]:\n                continue                                  # Null0, SINT0, the loopback, ports with no link\n            for k, v in e.values.items():\n                n = leaf(k)\n\
        \                if n == \"oper-status\":\n                    vals[\"oper_up\"] = up(v)\n                elif n in IFACE and \"/counters/\" + n in k:\n                    vals[IFACE[n]] = float(v)\n\
        \        elif sub == \"isis\":\n            i = tag(e, \"interface-name\")\n            t[\"interface\"] = i\n            t[\"peer\"] = NAME_BY_SYSID.get(tag(e, \"system-id\"), tag(e, \"system-id\"\
        ))\n            for k, v in e.values.items():\n                if leaf(k) == \"neighbor-state\":\n                    vals[\"adjacency_up\"] = up(v)\n        elif sub == \"bgp\":\n            af\
        \ = tag(e, \"af-name\")\n            fam = af.split(\"-\")[0]\n            a = tag(e, \"neighbor-address\")\n            t[\"peer\"] = NAME_BY_ADDR.get(a, a)\n            t[\"family\"] = fam\n \
        \           idx = \"\"\n            for k, v in e.values.items():\n                if k.endswith(\"/af-name\") and \"/af-data.\" in k and v == fam:\n                    idx = k.split(\"/af-data.\"\
        )[1].split(\"/\")[0]\n            for k, v in e.values.items():\n                n = leaf(k)\n                if n == \"connection-state\" and \"/af-data.\" not in k:\n                    vals[\"\
        established\"] = up(v)\n                elif idx and \"/af-data.\" + idx + \"/\" in k and n in (\"prefixes-accepted\", \"prefixes-advertised\"):\n                    vals[n.replace(\"-\", \"_\"\
        )] = float(v)\n        elif sub == \"bfd\":\n            i = tag(e, \"interface-name\")\n            t[\"interface\"] = i\n            t[\"peer\"] = PEER_BY_IF.get(i, \"\")\n            for k, v\
        \ in e.values.items():\n                if leaf(k) == \"state\":\n                    vals[\"session_up\"] = up(v)\n        elif sub == \"te\":\n            c = \"\"\n            for k, v in e.values.items():\n\
        \                n = leaf(k)\n                if n == \"color\":\n                    c = str(int(float(v)))\n                elif n == \"administrative-up\":\n                    vals[\"admin_up\"\
        ] = float(v)\n                elif n == \"operational-up\":\n                    vals[\"oper_up\"] = float(v)\n                elif n == \"ipv6\" and \"/destination-address/\" in k:\n          \
        \          t[\"endpoint\"] = NAME_BY_ADDR.get(v, v)\n            if not c:\n                continue\n            t[\"color\"] = c\n            t[\"policy\"] = POLICY_BY_COLOR.get(c, \"\")\n   \
        \     elif sub == \"system\":\n            t[\"location\"] = tag(e, \"node-name\")           # 0/RP0/CPU0 (the route processor), 0/0/CPU0 (the line card)\n            for k, v in e.values.items():\n\
        \                n = leaf(k)\n                if n in SYSTEM:\n                    vals[SYSTEM[n]] = float(v)\n        if vals:\n            e.tags.clear()\n            e.tags.update(t)\n      \
        \      e.values.clear()\n            e.values.update(vals)\n            out.append(e)\n    return out\n"
outputs:
  prom:
    type: prometheus
    listen: :9805
    path: /metrics
    metric-prefix: xr
    append-subscription-name: true
    export-timestamps: false
    expiration: 30s
    event-processors:
    - lab-names
