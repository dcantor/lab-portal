subscriptions:
  bgp:
    paths:
    - /network-instance[name=*]/protocols/bgp/neighbor[peer-address=*]/session-state
    mode: stream
    stream-mode: sample
    sample-interval: 15s
  bfd:
    paths:
    - /bfd/network-instance[name=default]/peer[local-discriminator=*]/session-state
    mode: stream
    stream-mode: sample
    sample-interval: 15s
  iface:
    paths:
    - /interface[name=*]/oper-state
    - /interface[name=*]/statistics/in-octets
    - /interface[name=*]/statistics/out-octets
    - /interface[name=*]/statistics/in-error-packets
    - /interface[name=*]/statistics/in-discarded-packets
    - /interface[name=*]/statistics/out-discarded-packets
    mode: stream
    stream-mode: sample
    sample-interval: 15s
  es:
    paths:
    - /system/network-instance/protocols/evpn/ethernet-segments/bgp-instance[id=1]/ethernet-segment[name=*]/oper-state
    mode: stream
    stream-mode: sample
    sample-interval: 15s
  routes:
    paths:
    - /network-instance[name=*]/route-table/ipv4-unicast/statistics/active-routes
    mode: stream
    stream-mode: sample
    sample-interval: 15s
  macs:
    paths:
    - /network-instance[name=*]/bridge-table/statistics/active-entries
    mode: stream
    stream-mode: sample
    sample-interval: 15s
  system:
    paths:
    - /platform/control[slot=*]/cpu[index=all]/total/average-1
    - /platform/control[slot=*]/memory/utilization
    mode: stream
    stream-mode: sample
    sample-interval: 15s
processors:
  short-names:
    event-strings:
      value-names:
      - .*
      transforms:
      - path-base:
          apply-on: name
  states:
    event-strings:
      value-names:
      - .*state$
      transforms:
      - replace:
          apply-on: value
          old: ^(up|UP|established)$
          new: '1'
      - replace:
          apply-on: value
          old: ^[A-Za-z][A-Za-z_-]*$
          new: '0'
  numbers:
    event-convert:
      value-names:
      - .*
      type: float
outputs:
  prom:
    type: prometheus
    listen: :9804
    path: /metrics
    metric-prefix: srl
    append-subscription-name: true
    export-timestamps: false
    expiration: 60s
    event-processors:
    - short-names
    - states
    - numbers
