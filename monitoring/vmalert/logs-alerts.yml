# Alerts derived from the VyOS nodes' syslog in VictoriaLogs (evaluated by vmalert; rule type vlogs = LogsQL).
# FRR logs routing state changes at informational — srv6-core/tools/frr_logging.py raises the level on every node.
# VyOS's rsyslog forwards every FRR line twice (socket + journal): `uniq` before counting. vmalert evaluates a vlogs group over
# the last `interval` (the `_time` filter in the expression cannot widen it), so an event keeps its alert firing for about
# one interval; the ALERTS series in VictoriaMetrics (remote write) is what the dashboards annotate from.
groups:
  - name: routing-events
    type: vlogs
    interval: 1m
    rules:
      - alert: BgpNeighborDownLogged
        expr: '_time:3m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense -hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:bgpd "%ADJCHANGE" "Down" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as downs'
        labels: {severity: warning, source: syslog}
        annotations: {summary: "{{ $labels.hostname }}: bgpd logged {{ $value }} neighbour Down transition(s) in the last 3 minutes"}
      - alert: IsisAdjacencyChangeLogged
        expr: '_time:3m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense -hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:isisd "ADJCHANGE" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as changes'
        labels: {severity: warning, source: syslog}
        annotations: {summary: "{{ $labels.hostname }}: isisd logged {{ $value }} adjacency change(s) in the last 3 minutes"}
      - alert: BfdSessionChangeLogged
        expr: '_time:3m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense -hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:bfdd ("state-change" OR "Down" OR "down") | uniq by (_time, hostname, _msg) | stats by (hostname) count() as changes'
        labels: {severity: warning, source: syslog}
        annotations: {summary: "{{ $labels.hostname }}: bfdd logged {{ $value }} session change(s) in the last 3 minutes"}
      - alert: FrrDaemonRestarted
        expr: '_time:5m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense -hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:watchfrr ("restart" OR "crash" OR "Restarting") | uniq by (_time, hostname, _msg) | stats by (hostname) count() as events'
        labels: {severity: critical, source: syslog}
        annotations: {summary: "{{ $labels.hostname }}: watchfrr restarted a routing daemon"}
      - alert: ZebraRouteInstallFailure
        expr: '_time:5m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense -hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:zebra ("netlink-dp" AND "error") -"platform_labels" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as errors'
        labels: {severity: warning, source: syslog}
        annotations: {summary: "{{ $labels.hostname }}: zebra failed to install {{ $value }} route(s) in the kernel"}

  - name: operations-events
    type: vlogs
    interval: 1m
    rules:
      - alert: ConfigCommitted                     # informational: shows on the alert list and as an event while it lasts
        expr: '_time:5m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense -hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:commit "Successful change" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as commits'
        labels: {severity: info, source: syslog}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} configuration commit(s) in the last 5 minutes"}
      - alert: SshAuthFailures
        expr: '_time:10m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense -hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:sshd ("Failed password" OR "Invalid user") | uniq by (_time, hostname, _msg) | stats by (hostname) count() as failures | filter failures:>5'
        labels: {severity: warning, source: syslog}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} SSH authentication failures in 10 minutes"}
      - alert: NodeSyslogSilent
        expr: '_time:10m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense -hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" hostname:* | stats by (hostname) count() as lines | filter lines:<1'
        labels: {severity: warning, source: syslog}
        annotations: {summary: "{{ $labels.hostname }}: no syslog for 10 minutes"}

  # evpn-fabric: its VyOS nodes (spines, leaves, borders, fw-ext) — FRR state changes and commits, labelled with their own lab so
  # the fabric's dashboard annotates them (the generic groups above exclude these hostnames; they would carry lab=srv6-core).
  - name: evpn-fabric-events
    type: vlogs
    interval: 1m
    rules:
      - alert: EvpnBgpNeighborDownLogged
        expr: '_time:3m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:bgpd "%ADJCHANGE" "Down" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as downs'
        labels: {severity: warning, source: syslog, lab: evpn-fabric}
        annotations: {summary: "{{ $labels.hostname }}: bgpd logged {{ $value }} neighbour Down transition(s) in the last 3 minutes"}
      - alert: EvpnBfdSessionChangeLogged
        expr: '_time:3m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:bfdd ("state-change" OR "Down" OR "down") | uniq by (_time, hostname, _msg) | stats by (hostname) count() as changes'
        labels: {severity: warning, source: syslog, lab: evpn-fabric}
        annotations: {summary: "{{ $labels.hostname }}: bfdd logged {{ $value }} session change(s) in the last 3 minutes"}
      - alert: EvpnFrrDaemonRestarted
        expr: '_time:5m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:watchfrr ("restart" OR "crash" OR "Restarting") | uniq by (_time, hostname, _msg) | stats by (hostname) count() as events'
        labels: {severity: critical, source: syslog, lab: evpn-fabric}
        annotations: {summary: "{{ $labels.hostname }}: watchfrr restarted a routing daemon"}
      - alert: EvpnConfigCommitted
        expr: '_time:5m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense hostname:~"^(spine[0-9]+|leaf[0-9]+|border[0-9]+|fw-ext)$" app_name:commit "Successful change" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as commits'
        labels: {severity: info, source: syslog, lab: evpn-fabric}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} configuration commit(s) in the last 5 minutes"}
      - alert: EvpnProtodownLogged           # the leaves' protodown watcher (core isolation / startup delay) taking segment ports down
        expr: '_time:5m -lab:evpn-clab -lab:srl-evpn -lab:evpn-pfsense hostname:~"^leaf[0-9]+$" app_name:evpn-fabric-protodown "down:" | stats by (hostname) count() as events'
        labels: {severity: warning, source: syslog, lab: evpn-fabric}
        annotations: {summary: "{{ $labels.hostname }}: segment port(s) taken down by FRR's protodown (core isolation or startup delay)"}

  # evpn-clab (VyOS on containerlab): its syslog arrives on VictoriaLogs' own listener (UDP 5515), which stamps lab=evpn-clab — its
  # hostnames are evpn-fabric's (spine1, leaf1, border1 …), so every rule here and elsewhere tells them apart by that field
  - name: evpn-clab-events
    type: vlogs
    interval: 1m
    rules:
      - alert: EvpnClabBgpNeighborDownLogged
        expr: '_time:3m lab:evpn-clab app_name:bgpd "%ADJCHANGE" "Down" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as downs'
        labels: {severity: warning, source: syslog, lab: evpn-clab}
        annotations: {summary: "{{ $labels.hostname }}: bgpd logged {{ $value }} neighbour Down transition(s) in the last 3 minutes"}
      - alert: EvpnClabOspfAdjacencyChangeLogged
        expr: '_time:3m lab:evpn-clab app_name:ospfd "AdjChg" "Full ->" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as changes'
        labels: {severity: warning, source: syslog, lab: evpn-clab}
        annotations: {summary: "{{ $labels.hostname }}: ospfd logged {{ $value }} adjacency loss(es) (Full -> …) in the last 3 minutes"}
      - alert: EvpnClabBfdSessionChangeLogged
        expr: '_time:3m lab:evpn-clab app_name:bfdd ("state-change" OR "Down" OR "down") | uniq by (_time, hostname, _msg) | stats by (hostname) count() as changes'
        labels: {severity: warning, source: syslog, lab: evpn-clab}
        annotations: {summary: "{{ $labels.hostname }}: bfdd logged {{ $value }} session change(s) in the last 3 minutes"}
      - alert: EvpnClabFrrDaemonRestarted
        expr: '_time:5m lab:evpn-clab app_name:watchfrr ("restart" OR "crash" OR "Restarting") | uniq by (_time, hostname, _msg) | stats by (hostname) count() as events'
        labels: {severity: critical, source: syslog, lab: evpn-clab}
        annotations: {summary: "{{ $labels.hostname }}: watchfrr restarted a routing daemon"}
      - alert: EvpnClabConfigCommitted
        expr: '_time:5m lab:evpn-clab app_name:commit "Successful change" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as commits'
        labels: {severity: info, source: syslog, lab: evpn-clab}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} configuration commit(s) in the last 5 minutes"}

  # evpn-pfsense (VyOS on containerlab + a pfSense pair and an OPNsense pair): its syslog arrives on VictoriaLogs' own listener
  # (UDP 5517, lab=evpn-pfsense) — the VyOS nodes directly, the four firewalls through a relay on the host
  - name: evpn-pfsense-events
    type: vlogs
    interval: 1m
    rules:
      - alert: EvpnPfsenseBgpNeighborDownLogged
        expr: '_time:3m lab:evpn-pfsense app_name:bgpd "%ADJCHANGE" "Down" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as downs'
        labels: {severity: warning, source: syslog, lab: evpn-pfsense}
        annotations: {summary: "{{ $labels.hostname }}: bgpd logged {{ $value }} neighbour Down transition(s) in the last 3 minutes"}
      - alert: EvpnPfsenseOspfAdjacencyChangeLogged
        expr: '_time:3m lab:evpn-pfsense app_name:ospfd "AdjChg" "Full ->" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as changes'
        labels: {severity: warning, source: syslog, lab: evpn-pfsense}
        annotations: {summary: "{{ $labels.hostname }}: ospfd logged {{ $value }} adjacency loss(es) (Full -> …) in the last 3 minutes"}
      - alert: EvpnPfsenseBfdSessionChangeLogged
        expr: '_time:3m lab:evpn-pfsense app_name:bfdd ("state-change" OR "Down" OR "down") | uniq by (_time, hostname, _msg) | stats by (hostname) count() as changes'
        labels: {severity: warning, source: syslog, lab: evpn-pfsense}
        annotations: {summary: "{{ $labels.hostname }}: bfdd logged {{ $value }} session change(s) in the last 3 minutes"}
      - alert: EvpnPfsenseCarpTransitionLogged      # a firewall's kernel: "carp: 2@vtnet2.101: BACKUP -> MASTER (…)" — a failover
        expr: '_time:3m lab:evpn-pfsense hostname:~"^(pf|opn)[0-9]+([.].*)?$" "carp:" "->" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as transitions'
        labels: {severity: warning, source: syslog, lab: evpn-pfsense}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} CARP state transition(s) in the last 3 minutes — a firewall failover"}
      - alert: EvpnPfsenseFrrDaemonRestarted
        expr: '_time:5m lab:evpn-pfsense app_name:watchfrr ("restart" OR "crash" OR "Restarting") | uniq by (_time, hostname, _msg) | stats by (hostname) count() as events'
        labels: {severity: critical, source: syslog, lab: evpn-pfsense}
        annotations: {summary: "{{ $labels.hostname }}: watchfrr restarted a routing daemon"}
      - alert: EvpnPfsenseConfigCommitted
        expr: '_time:5m lab:evpn-pfsense app_name:commit "Successful change" | uniq by (_time, hostname, _msg) | stats by (hostname) count() as commits'
        labels: {severity: info, source: syslog, lab: evpn-pfsense}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} configuration commit(s) in the last 5 minutes"}

  # srl-evpn (Nokia SR Linux on containerlab): its syslog arrives on VictoriaLogs' own listener (UDP 5516, lab=srl-evpn). SR Linux logs
  # structured events — "<subsystem>|pid|tid|seq|EV|<eventName>|<severity>: text" — so the rules match the event names; the nodes
  # send only the routing / port / segment / commit subsystems (fabric.yml: monitoring.syslog_subsystems)
  - name: srl-evpn-events
    type: vlogs
    interval: 1m
    rules:
      - alert: SrlEvpnBgpNeighborDownLogged
        expr: '_time:3m lab:srl-evpn "bgpNeighborBackwardTransition" | stats by (hostname) count() as downs'
        labels: {severity: warning, source: syslog, lab: srl-evpn}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} BGP session(s) fell from Established in the last 3 minutes"}
      - alert: SrlEvpnBfdDownLogged
        expr: '_time:3m lab:srl-evpn "bfdDownEvent" | stats by (hostname) count() as downs'
        labels: {severity: warning, source: syslog, lab: srl-evpn}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} BFD session(s) went down in the last 3 minutes"}
      - alert: SrlEvpnPortDownLogged
        expr: '_time:3m lab:srl-evpn "|EV|portDown|" | stats by (hostname) count() as downs'
        labels: {severity: warning, source: syslog, lab: srl-evpn}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} port(s) went down in the last 3 minutes"}
      - alert: SrlEvpnSegmentLegDownLogged
        expr: '_time:3m lab:srl-evpn ("|EV|lagDown|" OR "|EV|lagMemberOperDown|") | stats by (hostname) count() as downs'
        labels: {severity: warning, source: syslog, lab: srl-evpn}
        annotations: {summary: "{{ $labels.hostname }}: a dual-homed host's LAG (or a member) went down in the last 3 minutes"}
      - alert: SrlEvpnDfChangeLogged
        expr: '_time:5m lab:srl-evpn "DfStatusChanged" | stats by (hostname) count() as changes'
        labels: {severity: info, source: syslog, lab: srl-evpn}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} designated-forwarder change(s) on its Ethernet Segments in the last 5 minutes"}
      - alert: SrlEvpnConfigCommitted
        expr: '_time:5m lab:srl-evpn "commitSucceeded" | stats by (hostname) count() as commits'
        labels: {severity: info, source: syslog, lab: srl-evpn}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} configuration commit(s) in the last 5 minutes"}

  # The cat8000v-ipsec lab's VyOS firewalls (fw-east / fw-central / fw-west) forward their kernel firewall log here: rule 900 is the
  # logged drop at the end of the forward filter, the IKE / ESP / ICMP accept rules log the first packet of every flow. The rule label
  # `lab` overrides the evaluator's external label so the IPsec dashboard annotates these and the SRv6 one does not.
  - name: firewall-events
    type: vlogs
    interval: 1m
    rules:
      - alert: FirewallDropBurst
        expr: '_time:5m hostname:~"^fw-(east|central|west)$" app_name:kernel "FWD-filter-900-D" | extract " SRC=<src> DST=<dst> " | stats by (hostname, src) count() as drops | filter drops:>20'
        labels: {severity: warning, source: syslog, lab: cat8000v-ipsec}
        annotations: {summary: "{{ $labels.hostname }}: {{ $value }} packets from {{ $labels.src }} dropped in 5 minutes (forward filter rule 900)"}
      - alert: FirewallDroppingPeerTraffic         # a modelled VPN peer hitting the drop rule: the policy and the wiring disagree (a re-homed spoke, a stale address group)
        expr: '_time:5m hostname:~"^fw-(east|central|west)$" app_name:kernel "FWD-filter-900-D" (" PROTO=ESP" OR " DPT=500 " OR " DPT=4500 ") | extract " SRC=<src> DST=<dst> " | stats by (hostname, src, dst) count() as drops'
        labels: {severity: critical, source: syslog, lab: cat8000v-ipsec}
        annotations: {summary: "{{ $labels.hostname }}: IKE / ESP from {{ $labels.src }} to {{ $labels.dst }} dropped ({{ $value }} packets in 5 minutes) — not a modelled peer pair"}

  # c8000v-dmvpn-lab: IOS-XE syslog (logging host ... vrf Mgmt-vrf, origin-id hostname). IOS sends no RFC 3164 hostname
  # field, so the router is extracted from the message ("<seq>: <router>: *<time>: %FAC-SEV-MNEMONIC: ...").
  - name: c8000v-dmvpn-lab-events
    type: vlogs
    interval: 1m
    rules:
      - alert: DmvpnBgpNeighborDownLogged
        expr: '_time:3m facility_keyword:local7 "%BGP-5-ADJCHANGE" "Down" | extract "<seq>: <router>: " | stats by (router) count() as downs'
        labels: {severity: warning, source: syslog, lab: c8000v-dmvpn-lab}
        annotations: {summary: "{{ $labels.router }}: BGP logged {{ $value }} neighbour Down transition(s) in the last 3 minutes"}
      - alert: DmvpnNhsDownLogged
        expr: '_time:3m facility_keyword:local7 "NHRP_NHS_DOWN" | extract "<seq>: <router>: " | stats by (router) count() as downs'
        labels: {severity: warning, source: syslog, lab: c8000v-dmvpn-lab}
        annotations: {summary: "{{ $labels.router }}: an NHRP next-hop server went down {{ $value }} time(s) in the last 3 minutes"}
      - alert: DmvpnIkeSaDownLogged
        expr: '_time:3m facility_keyword:local7 ("%IKEV2-5-SA_DOWN" OR "%CRYPTO-5-SESSION_STATUS" "DOWN") | extract "<seq>: <router>: " | stats by (router) count() as downs'
        labels: {severity: warning, source: syslog, lab: c8000v-dmvpn-lab}
        annotations: {summary: "{{ $labels.router }}: {{ $value }} IKE / IPsec session(s) went down in the last 3 minutes"}
