# Lab monitoring on the NMS: Prometheus scrapes (targets discovered from each lab portal's /api/sd) and evaluates the alert
# rules; VictoriaMetrics keeps the long-term series (remote_write; 180 days) and also receives what the VyOS nodes push
# themselves (Telegraf -> InfluxDB write API); VictoriaLogs keeps their syslog (Telegraf -> Loki push API); Grafana (port
# 3001 — Gitea has 3000) reads VictoriaMetrics / VictoriaLogs for the dashboards and Prometheus for the alert state.
# deploy: ../monitoring/deploy.sh
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.152.0
    restart: unless-stopped
    command: ["--storageDataPath=/storage", "--retentionPeriod=180d", "--httpListenAddr=:8428"]
    ports: ["8428:8428"]
    volumes: ["vm_data:/storage"]

  victorialogs:                                   # syslog from the VyOS nodes (system syslog remote -> the native syslog receiver, UDP 5514 — 514 is the NMS rsyslog)
    image: victoriametrics/victoria-logs:v1.52.0
    restart: unless-stopped
    command: ["--storageDataPath=/vlogs", "--retentionPeriod=90d", "--httpListenAddr=:9428", "--syslog.listenAddr.udp=:5514", "--syslog.streamFields.udp=[\"hostname\",\"app_name\"]"]
    ports: ["9428:9428", "5514:5514/udp"]
    volumes: ["vl_data:/vlogs"]

  vmalert-logs:                                   # log-derived alerts: LogsQL rules against VictoriaLogs; alert state written to VictoriaMetrics (ALERTS)
    image: victoriametrics/vmalert:v1.152.0
    restart: unless-stopped
    command:
      - --datasource.url=http://victorialogs:9428
      - --rule=/etc/vmalert/logs-alerts.yml
      - --remoteWrite.url=http://victoriametrics:8428
      - --external.label=lab=srv6-core
      - --external.label=evaluator=vmalert-logs
      - --notifier.blackhole                     # no Alertmanager yet: alert state lives in VictoriaMetrics (ALERTS) and on :8880
      - --httpListenAddr=:8880
    ports: ["8880:8880"]
    volumes: ["./vmalert:/etc/vmalert:ro"]
    depends_on: [victorialogs, victoriametrics]

  goflow2:                                        # sFlow collector: decodes the samples from the PEs / Ps into JSON lines (shared volume)
    image: netsampler/goflow2:v2
    restart: unless-stopped
    command: ["-listen=sflow://:6343", "-format=json", "-transport=file", "-transport.file=/flows/flows.json", "-addr=:8080"]
    user: "0:0"                                   # the image runs unprivileged; the shared volume is root-owned
    ports: ["6343:6343/udp", "8083:8080"]
    volumes: ["flows:/flows"]

  flows-shipper:                                  # Fluent Bit tails goflow2's file into VictoriaLogs (structured records, stream per exporter)
    image: fluent/fluent-bit:3.2
    restart: unless-stopped
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/etc/flows/fluent-bit.conf"]
    volumes: ["flows:/flows", "./flows:/etc/flows:ro"]
    depends_on: [goflow2, victorialogs]

  flows-rotate:                                   # daily truncation of the goflow2 file
    image: busybox:1.37
    restart: unless-stopped
    command: ["sh", "/etc/flows/rotate.sh"]
    volumes: ["flows:/flows", "./flows:/etc/flows:ro"]

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d          # short: VictoriaMetrics is the store of record
      - --web.enable-lifecycle                     # POST /-/reload after a config change
      - --web.enable-remote-write-receiver
    ports: ["9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom_data:/prometheus
    depends_on: [victoriametrics]

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # lab: dashboards readable without a login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource   # VictoriaLogs (Grafana pulls it from grafana.com at start)
    ports: ["3001:3001"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [victoriametrics, victorialogs, prometheus]

volumes:
  vm_data:
  vl_data:
  flows:
  prom_data:
  grafana_data:
